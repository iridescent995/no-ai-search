<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NoAI Search</title><link rel="icon" href="icons/icon32.png"><link rel="stylesheet" href="popup.css"><script src="popup.js" defer></script></head>
<body><header><img src="icons/icon48.png" alt="" width="36" height="36"><div><h1>NoAI Search</h1><p class="tagline">Clear your Google Search.</p></div></header>
<main><div class="control"><div><label id="toggle-label" for="enabled">Hide AI Overviews</label><p id="status" role="status">Loading…</p></div><input type="checkbox" id="enabled" role="switch" aria-labelledby="toggle-label" aria-describedby="explanation" disabled></div>
<div class="control secondary"><div><label id="ai-mode-label" for="hideAiMode">Hide AI Mode tab</label><p id="ai-mode-status" class="status" role="status">Loading…</p></div><input type="checkbox" id="hideAiMode" role="switch" aria-labelledby="ai-mode-label" aria-describedby="explanation" disabled></div>
<p id="explanation">Choose what to hide. Keep the search results.<br>Changes apply to open Google Search tabs.</p></main>
</body></html>
